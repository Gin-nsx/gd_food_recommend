{% extends "base.html" %}

{% block title %}编辑美食 - 商家中心{% endblock %}

{% block content %}

<style>
    .form-box {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 35px 40px;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .form-box label {
        display: block;
        font-weight: 600;
        margin: 14px 0 4px;
        color: #333;
    }
    .form-box input, .form-box select, .form-box textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
    }
    .form-box textarea {
        height: 80px;
        resize: vertical;
    }
    .form-box .btn {
        width: 100%;
        padding: 12px;
        background: #c0392b;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
    }
    .form-box .btn:hover { background: #a93226; }
    .form-box .btn-secondary {
        background: #7f8c8d;
        margin-top: 10px;
    }
    .form-box .btn-secondary:hover { background: #5d6d7e; }
    .form-box .hint {
        font-size: 13px;
        color: #7f8c8d;
        margin-top: 4px;
    }
</style>

<h2 style="text-align:center; color:#c0392b; margin-bottom:24px;">✏️ 编辑美食</h2>

<div class="form-box">
    <form method="POST">
        <label>美食名称 <span style="color:#e74c3c;">*</span></label>
        <input type="text" name="name" value="{{ food.name }}" required>

        <label>分类</label>
        <select name="category_id">
            <option value="">未分类</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if cat.id == food.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>

        <label>价格（元） <span style="color:#e74c3c;">*</span></label>
        <input type="number" name="price" step="0.01" value="{{ food.price }}" required>

        <label>原材料</label>
        <input type="text" name="ingredients" value="{{ food.ingredients or '' }}">
        <div class="hint">多个原材料用中文逗号分隔</div>

        <label>口味描述</label>
        <textarea name="description">{{ food.description or '' }}</textarea>

        <button type="submit" class="btn">保存修改</button>
        <a href="{{ url_for('merchant.merchant_dashboard') }}" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none;">返回商家中心</a>
    </form>
</div>

{% endblock %}
