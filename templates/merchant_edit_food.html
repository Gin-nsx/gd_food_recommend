{% extends "base.html" %}

{% block title %}编辑美食 - 商家中心{% endblock %}

{% block content %}

<style>
    .form-head {
        max-width: 680px;
        margin: 0 auto 22px;
        text-align: center;
    }
    .form-head h2 {
        font-family: var(--font-serif);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--ink);
    }
    .form-head .sub { margin-top: 7px; font-size: 13px; color: var(--ink-3); }

    .form-box {
        max-width: 680px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--sh-1);
        padding: 30px 34px 34px;
    }
    .form-box form > label {
        display: block;
        margin: 18px 0 7px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: .04em;
        color: var(--ink-2);
    }
    .form-box form > label:first-of-type { margin-top: 0; }
    .form-box .req { color: var(--brand); font-weight: 600; }
    .form-box .hint { font-size: 11.5px; color: var(--ink-4); margin-top: 5px; line-height: 1.6; }
    .form-box .preview {
        display: block;
        width: 100%;
        max-width: 320px;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: var(--r);
        border: 1px solid var(--line);
        margin-top: 12px;
        background: var(--surface-2);
    }
    .form-box .preview.hidden, .form-box .hidden { display: none !important; }
    .form-box button.btn { width: 100%; margin-top: 24px; height: 46px; font-size: 15px; letter-spacing: .1em; }
    .form-box .btn-secondary { width: 100%; margin-top: 10px; text-align: center; }
    @media (max-width: 680px) {
        .form-box { padding: 22px 18px 26px; border-radius: var(--r); }
        .form-head h2 { font-size: 23px; }
    }
</style>

<script>
    // 选了新图就换预览，没选则一直显示当前图片
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.getElementById('imageInput');
        var preview = document.getElementById('imagePreview');
        if (!input || !preview) return;
        input.addEventListener('change', function () {
            var file = input.files && input.files[0];
            if (!file) return;
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
        });
    });
</script>

<div class="form-head"><h2>编辑美食</h2><p class="sub">修改后会重新进入审核流程</p></div>

<div class="form-box">
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label>美食名称 <span class="req">*</span></label>
        <input type="text" name="name" value="{{ food.name }}" required>

        <label>分类</label>
        <select name="category_id">
            <option value="">未分类</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if cat.id == food.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>

        <label>价格（元） <span class="req">*</span></label>
        <input type="number" name="price" step="0.01" value="{{ food.price }}" required>

        <label>原材料</label>
        <input type="text" name="ingredients" value="{{ food.ingredients or '' }}">
        <div class="hint">多个原材料用中文逗号分隔</div>

        <label>口味描述</label>
        <textarea name="description">{{ food.description or '' }}</textarea>

        <label>美食图片</label>
        {% if food.image_url %}
        <img id="imagePreview" class="preview" src="{{ url_for('static', filename=food.image_url) }}" alt="{{ food.name }}">
        {% else %}
        <img id="imagePreview" class="preview hidden" alt="预览">
        {% endif %}
        <input type="file" name="image" accept="image/jpeg,image/png,image/webp" id="imageInput">
        <div class="hint">不选则保留当前图片；新图会自动裁成 4:3 并压缩</div>

        <button type="submit" class="btn">保存修改</button>
        <a href="{{ url_for('merchant.merchant_dashboard') }}" class="btn btn-secondary">返回商家中心</a>
    </form>
</div>

{% endblock %}
