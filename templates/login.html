{% extends "base.html" %}

{% block title %}登录 - 广东美食推荐{% endblock %}

{% block content %}

<style>
    .login-box {
        max-width: 400px;
        margin: 40px auto;
        background: white;
        padding: 40px 45px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .login-box h2 {
        text-align: center;
        color: #c0392b;
        font-size: 26px;
        margin-bottom: 24px;
    }
    .login-box label {
        display: block;
        font-weight: 600;
        margin: 14px 0 4px;
        color: #333;
    }
    .login-box input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
    }
    .login-box .btn {
        width: 100%;
        padding: 12px;
        background: #c0392b;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
    }
    .login-box .btn:hover { background: #a93226; }
    .login-box .link {
        text-align: center;
        margin-top: 16px;
        color: #7f8c8d;
    }
    .login-box .link a { color: #3498db; text-decoration: none; }
</style>

<div class="login-box">
    <h2>🔐 登录</h2>
    <form method="POST">
        <label>用户名</label>
        <input type="text" name="username" placeholder="请输入用户名" required>
        <label>密码</label>
        <input type="password" name="password" placeholder="请输入密码" required>
        <button type="submit" class="btn">登 录</button>
    </form>
    <div class="link">还没有账号？<a href="{{ url_for('auth.register_page') }}">去注册</a></div>
</div>

{% endblock %}
