{% extends "base.html" %}

{% block title %}登录 - 广东美食推荐{% endblock %}

{% block content %}

<style>
    .auth-wrap {
        display: grid;
        grid-template-columns: 1.05fr .95fr;
        max-width: 940px;
        margin: 18px auto 40px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-xl);
        overflow: hidden;
        box-shadow: var(--sh-2);
        min-height: 520px;
    }
    .auth-aside {
        position: relative;
        padding: 44px 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #FFF6EA;
        background: #2A1A12 url("{{ url_for('static', filename='images/foods/27.jpg') }}") center / cover no-repeat;
    }
    .auth-aside::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(165deg, rgba(58, 17, 8, .93) 0%, rgba(34, 13, 6, .86) 50%, rgba(20, 9, 4, .80) 100%);
    }
    .auth-aside > * { position: relative; z-index: 1; }
    .auth-aside .seal {
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 10px;
        background: linear-gradient(160deg, #C0442C, #8E2A18);
        border: 1px solid rgba(255, 255, 255, .3);
        font-family: var(--font-serif);
        font-size: 19px;
        color: #FFF3E4;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    }
    .auth-aside .quote {
        font-family: var(--font-serif);
        font-size: 28px;
        line-height: 1.55;
        letter-spacing: .06em;
        color: #FFF3E2;
    }
    .auth-aside .quote small {
        display: block;
        margin-top: 16px;
        font-family: var(--font-sans);
        font-size: 12.5px;
        letter-spacing: .18em;
        color: rgba(240, 211, 168, .65);
    }
    .auth-aside .aside-foot {
        font-size: 11.5px;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: rgba(255, 240, 224, .4);
    }

    .auth-panel { padding: 48px 46px; display: flex; flex-direction: column; justify-content: center; }
    .auth-panel .eyebrow {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 10px;
    }
    .auth-panel h1 {
        font-family: var(--font-serif);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--ink);
        margin-bottom: 6px;
    }
    .auth-panel .sub { font-size: 13px; color: var(--ink-3); margin-bottom: 28px; }

    .auth-panel .field { margin-bottom: 16px; }
    .auth-panel .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: .04em;
        color: var(--ink-2);
        margin-bottom: 7px;
    }
    .auth-panel .field input,
    .auth-panel .field select { height: 44px; }

    .auth-panel .btn-block { margin-top: 10px; height: 46px; font-size: 15px; letter-spacing: .12em; }

    .auth-foot {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--ink-3);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }
    .auth-foot a { color: var(--brand); font-weight: 500; }
    .auth-foot a:hover { text-decoration: underline; }

    @media (max-width: 820px) {
        .auth-wrap { grid-template-columns: 1fr; min-height: 0; margin-top: 6px; }
        .auth-aside { display: none; }
        .auth-panel { padding: 32px 24px; }
        .auth-panel h1 { font-size: 24px; }
    }
</style>

<div class="auth-wrap">
    <aside class="auth-aside">
        <div class="seal">粤</div>
        <div class="quote">
            一盅两件，<br>半日清闲。
            <small>YUM CHA · 岭南饮食</small>
        </div>
        <div class="aside-foot">Guangdong Food Recommendation</div>
    </aside>

    <section class="auth-panel">
        <div class="eyebrow">Sign In</div>
        <h1>欢迎回来</h1>
        <p class="sub">登录后可收藏美食、参与评分，并获得专属口味推荐。</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

            <div class="field">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>

        <div class="auth-foot">
            <span>还没有账号？<a href="{{ url_for('auth.register_page') }}">立即注册</a></span>
            <a href="{{ url_for('index') }}">先随便逛逛 →</a>
        </div>
    </section>
</div>

{% endblock %}
