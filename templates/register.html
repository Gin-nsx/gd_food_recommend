{% extends "base.html" %}

{% block title %}注册 - 广东美食推荐{% endblock %}

{% block content %}

<style>
    .auth-wrap {
        display: grid;
        grid-template-columns: 1.05fr .95fr;
        max-width: 940px;
        margin: 18px auto 40px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-xl);
        overflow: hidden;
        box-shadow: var(--sh-2);
        min-height: 560px;
    }
    .auth-aside {
        position: relative;
        padding: 44px 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #FFF6EA;
        background: #2A1A12 url("{{ url_for('static', filename='images/foods/31.jpg') }}") center / cover no-repeat;
    }
    .auth-aside::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(165deg, rgba(58, 17, 8, .93) 0%, rgba(34, 13, 6, .86) 50%, rgba(20, 9, 4, .80) 100%);
    }
    .auth-aside > * { position: relative; z-index: 1; }
    .auth-aside .seal {
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 10px;
        background: linear-gradient(160deg, #C0442C, #8E2A18);
        border: 1px solid rgba(255, 255, 255, .3);
        font-family: var(--font-serif);
        font-size: 19px;
        color: #FFF3E4;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    }
    .auth-aside .quote {
        font-family: var(--font-serif);
        font-size: 28px;
        line-height: 1.55;
        letter-spacing: .06em;
        color: #FFF3E2;
    }
    .auth-aside .quote small {
        display: block;
        margin-top: 16px;
        font-family: var(--font-sans);
        font-size: 12.5px;
        letter-spacing: .18em;
        color: rgba(240, 211, 168, .65);
    }
    .auth-aside .aside-foot {
        font-size: 11.5px;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: rgba(255, 240, 224, .4);
    }

    .auth-panel { padding: 42px 46px; display: flex; flex-direction: column; justify-content: center; }
    .auth-panel .eyebrow {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 10px;
    }
    .auth-panel h1 {
        font-family: var(--font-serif);
        font-size: 27px;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--ink);
        margin-bottom: 6px;
    }
    .auth-panel .sub { font-size: 13px; color: var(--ink-3); margin-bottom: 24px; }

    .auth-panel .field { margin-bottom: 14px; }
    .auth-panel .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: .04em;
        color: var(--ink-2);
        margin-bottom: 6px;
    }
    .auth-panel .field input,
    .auth-panel .field select { height: 43px; }
    .auth-panel .field .hint { font-size: 11.5px; color: var(--ink-4); margin-top: 5px; }

    .role-hint { font-size: 11.5px; color: var(--ink-4); margin-top: 6px; line-height: 1.6; }
    .hidden { display: none !important; }

    .auth-panel .btn-block { margin-top: 14px; height: 46px; font-size: 15px; letter-spacing: .12em; }

    .auth-foot {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--ink-3);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }
    .auth-foot a { color: var(--brand); font-weight: 500; }
    .auth-foot a:hover { text-decoration: underline; }

    @media (max-width: 820px) {
        .auth-wrap { grid-template-columns: 1fr; min-height: 0; margin-top: 6px; }
        .auth-aside { display: none; }
        .auth-panel { padding: 30px 22px; }
        .auth-panel h1 { font-size: 23px; }
    }
</style>

<div class="auth-wrap">
    <aside class="auth-aside">
        <div class="seal">粤</div>
        <div class="quote">
            得闲饮茶，<br>食碗靓餸。
            <small>JOIN US · 一起找好吃的</small>
        </div>
        <div class="aside-foot">Guangdong Food Recommendation</div>
    </aside>

    <section class="auth-panel">
        <div class="eyebrow">Create Account</div>
        <h1>创建账号</h1>
        <p class="sub">注册后即可收藏、评分，让推荐越来越懂你的口味。</p>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="reg-username">用户名</label>
                <input type="text" id="reg-username" name="username" placeholder="请输入用户名" required autocomplete="username">
            </div>

            <div class="field">
                <label for="reg-password">密码</label>
                <input type="password" id="reg-password" name="password" placeholder="至少 6 位" required minlength="6" autocomplete="new-password">
            </div>

            <div class="field">
                <label for="roleSelect">注册身份</label>
                <select name="role" id="roleSelect">
                    <option value="user">普通用户 · 找吃的</option>
                    <option value="merchant">商家 · 开店铺</option>
                </select>
                <div class="role-hint">选择「商家」后，需管理员审核通过才能上传美食。</div>
            </div>

            <div id="addressField" class="field hidden">
                <label for="reg-address">店铺地址</label>
                <input type="text" id="reg-address" name="merchant_address" placeholder="请输入店铺地址">
            </div>

            <button type="submit" class="btn btn-primary btn-block">注 册</button>
        </form>

        <div class="auth-foot">
            <span>已有账号？<a href="{{ url_for('auth.login_page') }}">去登录</a></span>
            <a href="{{ url_for('index') }}">先随便逛逛 →</a>
        </div>
    </section>
</div>

<script>
    document.getElementById('roleSelect').addEventListener('change', function() {
        var addrField = document.getElementById('addressField');
        if (this.value === 'merchant') {
            addrField.classList.remove('hidden');
        } else {
            addrField.classList.add('hidden');
        }
    });
</script>

{% endblock %}
