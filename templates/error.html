{% extends "base.html" %}

{% block title %}{{ code }} {{ title }} - 广东美食推荐{% endblock %}

{% block content %}
<style>
    .err-wrap {
        max-width: 600px;
        margin: 60px auto 80px;
        text-align: center;
        padding: 0 20px;
    }
    .err-code {
        font-family: var(--font-serif);
        font-size: 104px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: .04em;
        background: linear-gradient(150deg, #B98A3E 0%, #A23A25 55%, #6E2415 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: .9;
    }
    .err-title {
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--ink);
        margin: 16px 0 10px;
    }
    .err-desc {
        font-size: 14px;
        color: var(--ink-3);
        line-height: 1.85;
        margin-bottom: 28px;
    }
    .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .err-btn {
        display: inline-flex;
        align-items: center;
        padding: 11px 26px;
        border-radius: 99px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: .04em;
        text-decoration: none;
        transition: all .22s var(--ease);
    }
    .err-btn.primary {
        background: linear-gradient(180deg, #AE4029, #963220);
        color: #FFF8F2;
        box-shadow: 0 10px 22px -14px rgba(122, 40, 22, .9);
    }
    .err-btn.primary:hover { background: linear-gradient(180deg, #BC4A32, #882C1A); transform: translateY(-2px); }
    .err-btn.ghost {
        background: var(--surface);
        color: var(--ink-2);
        border: 1px solid var(--line-2);
    }
    .err-btn.ghost:hover { background: var(--surface-2); color: var(--ink); transform: translateY(-2px); }
    .err-tip {
        margin-top: 34px;
        font-size: 12px;
        color: var(--ink-4);
        letter-spacing: .04em;
    }
</style>

<div class="err-wrap">
    <div class="err-code">{{ code }}</div>
    <div class="err-title">{{ title }}</div>
    <p class="err-desc">{{ message }}</p>

    <div class="err-actions">
        <a class="err-btn primary" href="{{ url_for('index') }}">回首页逛逛</a>
        <a class="err-btn ghost" href="javascript:history.back()">返回上一页</a>
    </div>

    {% if hint %}
    <div class="err-tip">{{ hint }}</div>
    {% endif %}
</div>
{% endblock %}
