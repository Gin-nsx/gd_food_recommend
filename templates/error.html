{% extends "base.html" %}

{% block title %}{{ code }} {{ title }} - 广东美食推荐{% endblock %}

{% block content %}
<style>
    .err-wrap {
        max-width: 620px;
        margin: 70px auto 90px;
        text-align: center;
        padding: 0 20px;
    }
    .err-code {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 2px;
    }
    .err-title {
        font-size: 22px;
        color: #2c3e50;
        font-weight: 700;
        margin: 14px 0 10px;
    }
    .err-desc {
        font-size: 14.5px;
        color: #7f8c8d;
        line-height: 1.8;
        margin-bottom: 26px;
    }
    .err-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .err-btn {
        padding: 10px 24px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 600;
        text-decoration: none;
        transition: transform .2s, box-shadow .2s;
    }
    .err-btn.primary {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: #fff;
        box-shadow: 0 6px 16px rgba(192, 57, 43, .22);
    }
    .err-btn.ghost {
        background: #fff;
        color: #c0392b;
        border: 1.5px solid #f0c9c3;
    }
    .err-btn:hover { transform: translateY(-2px); }
    .err-tip {
        margin-top: 30px;
        font-size: 12.5px;
        color: #b9ac9f;
    }
</style>

<div class="err-wrap">
    <div class="err-code">{{ code }}</div>
    <div class="err-title">{{ title }}</div>
    <p class="err-desc">{{ message }}</p>

    <div class="err-actions">
        <a class="err-btn primary" href="{{ url_for('index') }}">回首页逛逛</a>
        <a class="err-btn ghost" href="javascript:history.back()">返回上一页</a>
    </div>

    {% if hint %}
    <div class="err-tip">{{ hint }}</div>
    {% endif %}
</div>
{% endblock %}
